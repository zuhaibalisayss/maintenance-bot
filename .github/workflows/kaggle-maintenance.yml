name: Kaggle Dataset and Notebook

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout maintenance-bot
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing from GitHub Secrets."
            exit 1
          fi

          echo "KAGGLE_API_TOKEN is present."
          kaggle datasets list --mine --page-size 1

      - name: Create Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing."
            exit 1
          fi

          kaggle datasets create \
            -p kaggle-project/dataset \
            --public \
            --keep-tabular \
            --dir-mode skip

      - name: Show dataset status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets status zuhaibalisays/synthetic-student-performance

      - name: Configure Git
        run: |
          git config user.name "zuhaibalisayss"
          git config user.email "163395035+zuhaibalisayss@users.noreply.github.com"

      - name: Record successful publication
        run: |
          mkdir -p kaggle-project

          printf '%s\n' \
            "# Kaggle Publication Log" \
            "" \
            "The synthetic student performance dataset has been published to Kaggle." \
            > kaggle-project/publication-log.md

          git add kaggle-project/publication-log.md

          if git diff --cached --quiet; then
            echo "No publication log changes."
            exit 0
          fi

          git commit -m "chore: publish Kaggle dataset"
          git push
