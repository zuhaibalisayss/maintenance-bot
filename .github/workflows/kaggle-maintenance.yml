name: Kaggle Project Maintenance

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 3"

permissions:
  contents: write

jobs:
  kaggle-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout maintenance-bot
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Run Kaggle project maintenance
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python .github/scripts/kaggle_update.py

      - name: Configure Git
        run: |
          git config user.name "zuhaibalisayss"
          git config user.email "163395035+zuhaibalisayss@users.noreply.github.com."

      - name: Commit project update
        run: |
          git add kaggle-project/

          if git diff --cached --quiet; then
            echo "No project changes were created."
            exit 0
          fi

          git commit -m "chore: update Kaggle project"
          git push
